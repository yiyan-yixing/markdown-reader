name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd tests
          npx playwright install chromium

      - name: Run tests
        run: |
          HEADLESS=true bash run-tests.sh
