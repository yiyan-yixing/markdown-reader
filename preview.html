## Code Examples

### JavaScript

```javascript
function greet(name) {
  console.log(`Hello, ${name}!`);
  return { message: `Welcome to Markdown Reader` };
}

const reader = greet('World');
```

### Python

```python
from dataclasses import dataclass

@dataclass
class MarkdownReader:
    name: str = "Markdown Reader"
    version: str = "1.0.0"
    features: list = None

    def __post_init__(self):
        self.features = self.features or [
            "File tree", "TOC", "Themes", "Search"
        ]
```

  <script>
    // Standalone test: simulate content script without Chrome APIs
    // Read from textarea, inject into reader UI
    document.addEventListener('DOMContentLoaded', () => {
      const raw = document.getElementById('test-raw').value.trim();

      // Create a fake <pre> so getRawMarkdownFromPage can find it
      const pre = document.createElement('pre');
      pre.textContent = raw;
      document.body.appendChild(pre);

      // Now load content.js which will detect and render
      const script = document.createElement('script');
      script.src = 'content/content.js';
      document.body.appendChild(script);
    });
  </script>
